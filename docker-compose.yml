version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=CULT_SECRET_KEY_2026
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=https://cult-open.onrender.com
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

